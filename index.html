<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ADI Toolkit</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #0f172a;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    header {
      margin-bottom: 18px;
      padding: 24px;
      border-radius: 22px;
      background: white;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 42px;
    }

    header p {
      margin: 0;
      color: #64748b;
      font-size: 18px;
    }

    .category-grid,
    .topic-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
    }

    .category-card {
      min-height: 130px;
      padding: 22px;
      border: none;
      border-radius: 20px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22);
    }

    .category-card:nth-child(8n + 1) {
      background: #2563eb;
    }

    .category-card:nth-child(8n + 2) {
      background: #059669;
    }

    .category-card:nth-child(8n + 3) {
      background: #d97706;
    }

    .category-card:nth-child(8n + 4) {
      background: #7c3aed;
    }

    .category-card:nth-child(8n + 5) {
      background: #0891b2;
    }

    .category-card:nth-child(8n + 6) {
      background: #db2777;
    }

    .category-card:nth-child(8n + 7) {
      background: #475569;
    }

    .category-card:nth-child(8n + 8) {
      background: #6d28d9;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .page-panel {
      padding: 22px;
      border-radius: 22px;
      background: white;
    }

    .page-heading {
      margin: 0 0 18px;
      font-size: 34px;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 18px;
      padding: 13px 18px;
      border: none;
      border-radius: 11px;
      background: #475569;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .topic-button {
      min-height: 84px;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #2563eb;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .topic-button.empty {
      background: #64748b;
    }

    .video-card {
      margin-bottom: 22px;
      padding: 20px;
      border-radius: 18px;
      background: #f1f5f9;
    }

    .video-card h2 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .video {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 14px;
      background: black;
    }

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .empty-message {
      padding: 25px;
      border-radius: 16px;
      background: #f1f5f9;
      color: #64748b;
      text-align: center;
      font-size: 19px;
    }

    footer {
      margin-top: 18px;
      padding: 17px;
      border-radius: 18px;
      background: white;
      color: #64748b;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 11px;
      }

      header h1 {
        font-size: 34px;
      }

      .category-grid,
      .topic-grid {
        grid-template-columns: 1fr;
      }

      .category-card {
        min-height: 100px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HOME SCREEN -->

    <section
      id="home-screen"
      class="screen active"
    >

      <header>
        <h1>ADI Toolkit</h1>

        <p>
          Teaching videos and resources for use during lessons.
        </p>
      </header>

      <main
        id="category-grid"
        class="category-grid"
      ></main>

      <footer>
        Choose a category to see its subjects.
      </footer>

    </section>


    <!-- CATEGORY SCREEN -->

    <section
      id="category-screen"
      class="screen"
    >

      <button
        class="back-button"
        onclick="showHome()"
      >
        ← Back to ADI Toolkit
      </button>

      <div class="page-panel">

        <h1
          id="category-heading"
          class="page-heading"
        ></h1>

        <div
          id="topic-grid"
          class="topic-grid"
        ></div>

      </div>

    </section>


    <!-- TOPIC AND VIDEO SCREEN -->

    <section
      id="topic-screen"
      class="screen"
    >

      <button
        class="back-button"
        onclick="showCurrentCategory()"
      >
        ← Back to subjects
      </button>

      <div class="page-panel">

        <h1
          id="topic-heading"
          class="page-heading"
        ></h1>

        <div id="video-list"></div>

      </div>

    </section>

  </div>


  <script src="videos.js"></script>

  <script>
    let currentCategoryIndex = 0;

    function hideAllScreens() {
      document
        .querySelectorAll(".screen")
        .forEach(function (screen) {
          screen.classList.remove("active");
        });
    }

    function showHome() {
      hideAllScreens();

      document
        .getElementById("home-screen")
        .classList.add("active");

      window.scrollTo(0, 0);
    }

    function showCategory(categoryIndex) {
      currentCategoryIndex = categoryIndex;

      const category = toolkitData[categoryIndex];

      document.getElementById(
        "category-heading"
      ).textContent =
        category.icon + " " + category.name;

      const topicGrid =
        document.getElementById("topic-grid");

      topicGrid.innerHTML = "";

      category.topics.forEach(function (topic, topicIndex) {
        const button = document.createElement("button");

        button.className = "topic-button";

        if (!topic.videos || topic.videos.length === 0) {
          button.classList.add("empty");
        }

        button.textContent = topic.name;

        button.onclick = function () {
          showTopic(categoryIndex, topicIndex);
        };

        topicGrid.appendChild(button);
      });

      hideAllScreens();

      document
        .getElementById("category-screen")
        .classList.add("active");

      window.scrollTo(0, 0);
    }

    function showCurrentCategory() {
      showCategory(currentCategoryIndex);
    }

    function showTopic(categoryIndex, topicIndex) {
      currentCategoryIndex = categoryIndex;

      const topic =
        toolkitData[categoryIndex].topics[topicIndex];

      document.getElementById(
        "topic-heading"
      ).textContent = topic.name;

      const videoList =
        document.getElementById("video-list");

      videoList.innerHTML = "";

      if (!topic.videos || topic.videos.length === 0) {
        videoList.innerHTML = `
          <div class="empty-message">
            No videos or resources have been added yet.
          </div>
        `;
      } else {
        topic.videos.forEach(function (video) {
          const card = document.createElement("div");

          card.className = "video-card";

          card.innerHTML = `
            <h2>${video.title}</h2>

            <div class="video">
              <iframe
                src="https://www.youtube.com/embed/${video.id}"
                title="${video.title}"
                allow="accelerometer; autoplay;
                       clipboard-write; encrypted-media;
                       gyroscope; picture-in-picture;
                       web-share"
                allowfullscreen>
              </iframe>
            </div>
          `;

          videoList.appendChild(card);
        });
      }

      hideAllScreens();

      document
        .getElementById("topic-screen")
        .classList.add("active");

      window.scrollTo(0, 0);
    }

    function buildHomeScreen() {
      const categoryGrid =
        document.getElementById("category-grid");

      toolkitData.forEach(function (category, index) {
        const button = document.createElement("button");

        button.className = "category-card";

        button.textContent =
          category.icon + " " + category.name;

        button.onclick = function () {
          showCategory(index);
        };

        categoryGrid.appendChild(button);
      });
    }

    buildHomeScreen();
  </script>

</body>
</html>
